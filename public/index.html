<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d141c">
<meta name="mobile-web-app-capable" content="yes">
<title>Tank Duel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
<style>
  :root{
    --panel:#16202c; --panel-2:#1e2c3c; --ink:#f2f7ff; --muted:#93a7bd;
    --sky:linear-gradient(#4fa8dd, #93d3f0 55%, #d7f0fb);
  }
  *{box-sizing:border-box}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none}
  body{
    margin:0; background:#0d141c; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-weight:800; -webkit-text-size-adjust:100%; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
    display:flex; justify-content:center;
  }

  .wrap{
    /* The battlefield is square, so cap the width against the viewport height:
       it keeps the stage near-square and stops a wide window filling itself
       with scenery either side of the fight. */
    width:100%; max-width:min(1200px, 125vh); height:100vh; height:100dvh;
    display:flex; flex-direction:column; gap:8px;
    padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  }

  /* ---------- top bar: scores + round ---------- */
  .hud{
    flex:none; display:flex; align-items:center; gap:10px;
    background:var(--panel); border-radius:14px; padding:8px 14px;
  }
  .scores{display:flex; align-items:center; gap:8px; flex:1; min-width:0; flex-wrap:nowrap; overflow:hidden}
  .score{display:flex; align-items:center; gap:7px; min-width:0; padding:3px 7px; border-radius:10px; border:3px solid transparent}
  .score .chip{width:20px; height:20px; border-radius:6px; flex:none; box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
  .score .name{font-size:clamp(11px,1.7vw,16px); letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:9ch}
  .score .num{font-size:clamp(20px,3.6vw,34px); line-height:1; font-variant-numeric:tabular-nums}
  .score.active{border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.06)}
  .score.dead{opacity:.4}
  .score.dead .name{text-decoration:line-through}

  /* The familiar four-corner glyph, drawn as paths so it needs no icon font. */
  .hud #full{flex:none; margin-left:10px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
  #full .icon{width:1.25em; height:1.25em; fill:currentColor; flex:none}
  #full .i-exit{display:none}
  #full.on .i-enter{display:none}
  #full.on .i-exit{display:inline}
  .meta{text-align:center; padding-left:6px; flex:none}
  .meta .lbl{font-size:10px; letter-spacing:.22em; color:var(--muted)}
  .meta .val{font-size:clamp(16px,3vw,24px); line-height:1.15; font-variant-numeric:tabular-nums}

  /* ---------- stage (flexes to fill; canvas letterboxes into it) ---------- */
  .stage{
    position:relative; flex:1 1 auto; min-height:0;
    border-radius:16px; overflow:hidden; background:var(--sky);
    box-shadow:0 8px 26px rgba(0,0,0,.45);
  }
  /* The canvas fills the stage exactly; the game draws edge-to-edge itself. */
  canvas{display:block; width:100%; height:100%; touch-action:none}

  .banner{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(8,14,22,.74); backdrop-filter:blur(3px); text-align:center; padding:14px;
  }
  .banner[hidden]{display:none}
  .banner h2{margin:0; font-size:clamp(24px,5.5vw,60px); line-height:1.05; text-shadow:0 5px 0 rgba(0,0,0,.35)}
  .banner p{margin:0; color:var(--muted); font-size:clamp(11px,2vw,17px)}
  .banner .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

  /* ---------- controls ---------- */
  .controls{flex:none; background:var(--panel); border-radius:14px; padding:8px 12px 10px; display:flex; flex-direction:column; gap:8px}

  .turnbar{display:flex; align-items:center; gap:8px; font-size:clamp(13px,2.3vw,18px)}
  .turnbar .chip{width:18px; height:18px; border-radius:6px; flex:none; box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
  .turnbar .hint{font-size:11px; color:var(--muted); letter-spacing:.14em; white-space:nowrap}
  .turnbar .spacer{flex:1}
  #turnText{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:14ch}
  .keys{font-size:11px; color:var(--muted); letter-spacing:.04em; font-weight:600; white-space:nowrap}
  kbd{background:var(--panel-2); border-radius:4px; padding:1px 5px; font:inherit; font-size:10px}

  /* The wide column gap keeps the angle "+" and the power "−" — side by side
     in this layout — far enough apart that a fat finger can't hit the wrong
     dial. */
  .dials{display:grid; grid-template-columns:1fr 1fr auto; gap:12px 56px; align-items:end}
  .dial label{display:flex; justify-content:space-between; align-items:baseline; font-size:11px; letter-spacing:.18em; color:var(--muted); margin-bottom:2px}
  .dial .read{font-size:clamp(17px,3vw,26px); color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:0}

  /* --p is how far along the thumb sits (0..1); --tw is the thumb width, so the
     fill stops under the middle of the ball instead of running past it. */
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:38px; background:transparent;
    cursor:pointer; margin:0; touch-action:none;
    --p:0; --tw:36px; --accent:#fff; --fill:transparent;
    --stop:calc(var(--p) * (100% - var(--tw)) + var(--tw) / 2);
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:14px; border-radius:99px; box-shadow:inset 0 2px 4px rgba(0,0,0,.5);
    background:linear-gradient(to right, var(--fill) 0 var(--stop), var(--panel-2) var(--stop) 100%);
  }
  input[type=range]::-moz-range-track{
    height:14px; border-radius:99px; box-shadow:inset 0 2px 4px rgba(0,0,0,.5);
    background:linear-gradient(to right, var(--fill) 0 var(--stop), var(--panel-2) var(--stop) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:36px; height:36px; margin-top:-11px; border-radius:50%;
    background:var(--accent); border:4px solid #0d141c; box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:var(--accent); border:4px solid #0d141c; box-shadow:0 3px 8px rgba(0,0,0,.5)}
  input[type=range]:focus-visible{outline:3px solid #fff; outline-offset:4px; border-radius:99px}
  input[type=range]:disabled{opacity:.45; cursor:default}
  /* The angle slider runs right-to-left so pushing the thumb right (toward +)
     lowers the angle, i.e. swings the barrel clockwise — the thumb moves the
     same way the barrel does. The value stays the true angle in degrees. */
  #angle{direction:rtl}

  button{
    font:inherit; font-size:clamp(14px,2.6vw,20px); letter-spacing:.06em; color:#0d141c; background:#ffd54a;
    border:none; border-radius:12px; padding:12px 22px; cursor:pointer; box-shadow:0 5px 0 #b8912a;
    transition:transform .06s, box-shadow .06s; -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:translateY(4px); box-shadow:0 1px 0 #b8912a !important}
  button:disabled{opacity:.4; cursor:default; transform:none}
  button:focus-visible{outline:3px solid #fff; outline-offset:3px}
  button.ghost{background:var(--panel-2); color:var(--ink); box-shadow:0 4px 0 #0b1119}
  button.tiny{font-size:13px; padding:7px 11px; border-radius:9px; letter-spacing:0}
  #sound{display:inline-grid; place-items:center; padding:7px 9px}
  #sound svg{width:16px; height:16px}
  /* the [hidden] UA rule doesn't reliably reach SVG elements */
  #sound svg[hidden]{display:none}
  .fire{min-width:170px; height:56px; padding:0 26px; color:#fff}

  /* One-at-a-time nudges either side of each slider, for fine aiming. */
  .dial .track{display:flex; align-items:center; gap:7px}
  .dial .track input[type=range]{flex:1 1 auto; min-width:0}
  .step{
    flex:none; width:36px; height:36px; padding:0; border-radius:10px;
    background:var(--panel-2); color:var(--ink); box-shadow:0 3px 0 #0b1119;
    font-size:21px; line-height:1;
  }
  .step:active{box-shadow:0 0 0 #0b1119 !important}
  .step:disabled{opacity:.35}

  /* ---------- setup screen ---------- */
  .setup{
    position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px,2.4vh,22px); padding:16px; overflow:auto;
    background:rgba(9,15,23,.86); backdrop-filter:blur(4px);
  }
  .setup[hidden]{display:none}
  .setup h1{
    margin:0; font-size:clamp(28px,7vw,64px); letter-spacing:.06em; line-height:1;
    background:linear-gradient(#ffe27a,#ff9d2e); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));
  }
  .setup .sub{margin:-6px 0 0; color:var(--muted); font-size:clamp(11px,2vw,15px); font-weight:600; letter-spacing:.18em}
  .field{display:flex; align-items:center; gap:10px}
  .field > .lbl{font-size:11px; letter-spacing:.2em; color:var(--muted)}
  .pill{background:var(--panel-2); color:var(--ink); box-shadow:0 4px 0 #0b1119; padding:10px 20px; border-radius:11px; font-size:clamp(15px,2.6vw,20px)}
  .pill[aria-pressed=true]{background:#ffd54a; color:#0d141c; box-shadow:0 4px 0 #b8912a}
  .pill.sq{padding:8px 0; width:46px; text-align:center; font-size:22px; line-height:1}
  .field .val{min-width:3.2ch; text-align:center; font-size:clamp(16px,2.6vw,21px); font-variant-numeric:tabular-nums}
  .field .note{font-size:11px; letter-spacing:.14em; color:#ffb03a; text-transform:uppercase}
  .field .note[hidden]{display:none}
  .pill:disabled{opacity:.35}
  /* Size is set from JS: the preview is drawn at the battlefield's own scale,
     so the tank in it is exactly the tank you get. */
  .preview{border-radius:11px; display:block; border:3px solid var(--panel-2); background:#8fd0ef}
  .players{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .pcard{display:flex; align-items:center; gap:8px; background:var(--panel); border-radius:12px; padding:8px 10px; border:3px solid var(--c)}
  .pcard .chip{width:20px; height:20px; border-radius:6px; background:var(--c); flex:none; box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
  .pcard input{
    font:inherit; font-size:clamp(13px,2.2vw,17px); font-weight:800; color:var(--ink); background:transparent;
    border:none; border-bottom:2px solid var(--panel-2); width:8.5ch; padding:3px 0; letter-spacing:.04em;
  }
  .pcard input:focus{outline:none; border-bottom-color:var(--c)}

  /* ---------- short viewports (phone held sideways) ---------- */
  /* Driven by the `short` class rather than a height media query, because when
     the page is rendered rotated (below) the useful height is the viewport's
     *width* — a media query would measure the wrong axis. JS sets the class.
     The controls float over the battlefield so the field keeps the full
     height; the game reserves matching dead space at the bottom of the
     world (see view.inset) so no terrain or tank hides behind them. */
  html.short .wrap{position:relative; gap:6px; padding:5px calc(5px + env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) calc(5px + env(safe-area-inset-left))}
  html.short .controls{
    position:absolute; z-index:5;
    left:calc(5px + env(safe-area-inset-left)); right:calc(5px + env(safe-area-inset-right)); bottom:calc(5px + env(safe-area-inset-bottom));
    background:rgba(20,30,42,.82); backdrop-filter:blur(8px);
    padding:5px 9px 7px; gap:5px; border-radius:11px;
  }
  html.short .hud{padding:4px 10px; border-radius:11px}
  html.short .score .num{font-size:24px}
  html.short .dials{gap:9px 44px}
  html.short .dial label{margin-bottom:0}
  html.short .step{width:30px; height:30px; font-size:18px; border-radius:8px}
  html.short .dial .track{gap:5px}
  html.short input[type=range]{height:30px; --tw:30px}
  html.short input[type=range]::-webkit-slider-thumb{width:30px; height:30px; margin-top:-8px}
  html.short .fire{height:44px; min-width:120px; padding:0 16px}
  html.short .banner{gap:9px}
  html.short .setup{gap:9px}
  html.short .setup h1{font-size:30px}
  html.short .pcard{padding:5px 8px}

  @media (pointer:coarse){ .keys{display:none} }

  /* ---------- narrow viewports (phone held upright) ----------
     Portrait has height to spare and none to waste sideways, so the dials
     stack — angle above power, each on a full-width row — and the FIRE
     button drops onto its own full-width row below them. The stage flexes,
     so it gives up the height the taller panel needs. The scoreboard keeps
     just the colour chips and numbers — the name of whoever is up is
     already on the turn line directly below. */
  @media (max-width:560px){
    .step{width:32px; height:32px; font-size:19px}
    .dial .track{gap:5px}
    /* Let a row spill onto a second line rather than squeezing, and give the
       "direct hits only" note a line of its own. */
    .field{flex-wrap:wrap; justify-content:center; row-gap:4px}
    .field .note{flex-basis:100%; text-align:center}
    .score .name{display:none}
    /* The round number is on the win banner anyway; the scores need the room. */
    .meta{display:none}
    .score .num{font-size:19px}
    .score{gap:5px; padding:2px 4px; border-width:2px}
    .score{gap:5px; padding:3px 5px}
    .scores{gap:4px}
    /* Stacked dials: extra space between the two dial rows so a fat finger
       on one row's buttons can't land on the other — FIRE keeps its tight
       gap below. */
    .dials{grid-template-columns:1fr; gap:8px}
    .dial + .dial{margin-top:20px}
    .fire{grid-column:1 / -1; width:100%; min-width:0; margin-top:2px}
    .turnbar{flex-wrap:wrap; row-gap:4px}
    .turnbar .hint{font-size:10px}
    .players{flex-direction:column; width:100%; max-width:280px}
    .pcard{width:100%}
    .pcard input{flex:1; width:auto}
  }
</style>
</head>
<body>

<!-- ---------------------------------------------------------- setup screen -->
<div class="setup" id="setup">
  <h1>TANK DUEL</h1>
  <p class="sub">ONE HIT KNOCKS YOU OUT</p>

  <div class="field">
    <span class="lbl">PLAYERS</span>
    <button class="pill" data-n="2" aria-pressed="true">2</button>
    <button class="pill" data-n="3" aria-pressed="false">3</button>
    <button class="pill" data-n="4" aria-pressed="false">4</button>
  </div>

  <div class="players" id="players"></div>

  <canvas id="sizePreview" class="preview" aria-label="Tank size and blast radius preview"></canvas>

  <div class="field">
    <span class="lbl">TANK SIZE</span>
    <button class="pill sq" id="sizeDown" aria-label="Smaller tanks">&minus;</button>
    <span class="val" id="sizeVal">1.0&times;</span>
    <button class="pill sq" id="sizeUp" aria-label="Bigger tanks">+</button>
  </div>

  <div class="field">
    <span class="lbl">BLAST RADIUS</span>
    <button class="pill sq" id="blastDown" aria-label="Smaller blast">&minus;</button>
    <span class="val" id="blastVal">48</span>
    <button class="pill sq" id="blastUp" aria-label="Bigger blast">+</button>
    <span class="note" id="blastNote">direct hits only</span>
  </div>

  <button id="start">START BATTLE</button>
</div>

<div class="wrap">
  <header class="hud">
    <div class="scores" id="scores"></div>
    <div class="meta">
      <div class="lbl">ROUND</div>
      <div class="val" id="roundVal">1</div>
    </div>
    <button class="ghost tiny" id="full" title="Full screen">
      <svg class="icon" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
        <g class="i-enter">
          <path d="m 10,16 2,0 0,-4 4,0 0,-2 L 10,10 l 0,6 0,0 z"/>
          <path d="m 20,10 0,2 4,0 0,4 2,0 L 26,10 l -6,0 0,0 z"/>
          <path d="m 24,24 -4,0 0,2 L 26,26 l 0,-6 -2,0 0,4 0,0 z"/>
          <path d="M 12,20 10,20 10,26 l 6,0 0,-2 -4,0 0,-4 0,0 z"/>
        </g>
        <g class="i-exit">
          <path d="m 14,14 -4,0 0,2 6,0 0,-6 -2,0 0,4 0,0 z"/>
          <path d="m 22,14 0,-4 -2,0 0,6 6,0 0,-2 -4,0 0,0 z"/>
          <path d="m 20,26 2,0 0,-4 4,0 0,-2 -6,0 0,6 0,0 z"/>
          <path d="m 10,22 4,0 0,4 2,0 0,-6 -6,0 0,2 0,0 z"/>
        </g>
      </svg>
      <span id="fullLabel">Full Screen</span>
    </button>
  </header>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="banner" id="banner" hidden>
      <h2 id="bannerTitle">—</h2>
      <p id="bannerText"></p>
      <div class="row">
        <button id="bannerBtn">Next round</button>
        <button class="ghost" id="bannerNew">New game</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="turnbar">
      <span class="chip" id="turnChip"></span><span id="turnText">—</span>
      <span class="hint" id="hint">1 HIT = OUT</span>
      <span class="spacer"></span>
      <span class="keys"><kbd>←</kbd><kbd>→</kbd> angle <kbd>↑</kbd><kbd>↓</kbd> power <kbd>space</kbd> fire</span>
      <!-- The icon shows what pressing WILL do: crossed-out speaker mutes,
           speaker with waves unmutes. Inline SVGs in the classic flat
           speaker-icon style; no external assets. -->
      <button class="ghost tiny" id="sound" aria-label="Mute" title="Mute">
        <svg id="sndMute" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M2 7v6h4l5 4V3L6 7H2z"/><path d="M4 16 16 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg id="sndUnmute" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" hidden><path d="M2 7v6h4l5 4V3L6 7H2z"/><path d="M13.2 6.8a4.5 4.5 0 0 1 0 6.4M15.4 4.6a7.5 7.5 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="ghost tiny" id="newGame">New</button>
    </div>

    <div class="dials">
      <div class="dial">
        <label for="angle">ANGLE <span class="read"><span id="angleRead">45</span>°</span></label>
        <div class="track">
          <button class="step" id="angleDown" aria-label="Rotate barrel anti-clockwise one degree">&minus;</button>
          <input type="range" id="angle" min="0" max="180" step="1" value="45" aria-label="Angle in degrees">
          <button class="step" id="angleUp" aria-label="Rotate barrel clockwise one degree">+</button>
        </div>
      </div>
      <div class="dial">
        <label for="power">POWER <span class="read" id="powerRead">60</span></label>
        <div class="track">
          <button class="step" id="powerDown" aria-label="Power down one">&minus;</button>
          <input type="range" id="power" min="10" max="100" step="1" value="60" aria-label="Power">
          <button class="step" id="powerUp" aria-label="Power up one">+</button>
        </div>
      </div>
      <button class="fire" id="fire">FIRE!</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ------------------------------------------------------------------ constants
// The world is a SQUARE of world units. A square is the one shape that suits
// every screen equally: it is scaled to fit whatever viewport it lands in, and
// the leftover screen on the long axis is filled with more of the same
// battlefield (§ overscan), so a phone held upright, a phone on its side and a
// desktop all get the same fight, just framed differently.
const SIZE = 700;
const W = SIZE, H = SIZE;

// No wind: this is a game for young children, and a shell that always does
// the same thing for the same dials is what makes it learnable.
const GRAV = 320;                   // world units/s²
// Full power carries about 1.15 battlefields, so the far side is always
// reachable but never trivially so.
const MUZZLE_V = Math.sqrt(GRAV * W * 1.15) / 100;

// How big the tanks are, chosen on the setup screen. Everything about a tank —
// how it is drawn, where its barrel sits, and how big a target it is — scales
// together, so a bigger tank really is easier to hit.
const TANK_SIZES = [0.35, 0.45, 0.55, 0.7, 0.85, 1, 1.2, 1.45, 1.75];
let sizeIdx = 5;                    // 1x by default
let tankScale = TANK_SIZES[sizeIdx];
// Blast radius, chosen on the setup screen. Zero is deliberately allowed: it
// means a shell only ever kills the tank it physically strikes.
const BLAST_SIZES = [0, 24, 36, 48, 64, 84];
let blastIdx = 3;
let blastR = BLAST_SIZES[blastIdx];
const TANK_R = 20;                  // tank hit radius
const BEDROCK = H - 2;              // ground can never be dug below this

const PALETTE = [
  { name: 'RED',    colour: '#ef4a3f', dark: '#a32a22' },
  { name: 'BLUE',   colour: '#3b86f0', dark: '#1c4f9e' },
  { name: 'GREEN',  colour: '#41c25c', dark: '#237a37' },
  { name: 'YELLOW', colour: '#f2c231', dark: '#a5801a' },
];

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// Camera: the 1200x700 world is scaled to fit the canvas, and whatever screen
// is left over on the sides shows more of the same battlefield (sky above,
// ground below) rather than empty letterbox bars.
const view = {
  s: 1, offX: 0, offY: 0,       // world -> css transform
  x0: 0, x1: W, y0: 0, y1: H,   // visible rect, in world coordinates
  inset: 0,                     // world units hidden behind the floating controls
};

// ------------------------------------------------------------------ utilities
const rand = (a, b) => a + Math.random() * (b - a);
// Blend a hex colour towards white, for the paler of the two dial shades.
function tint(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const mix = c => Math.round(c + (255 - c) * amt);
  return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ix = x => clamp(Math.round(x), 0, W - 1);
const el = id => document.getElementById(id);

// ------------------------------------------------------------------ sound
// Everything is synthesised — no audio files to ship.
let actx = null, muted = false, noise = null;
function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function noiseBuffer(a) {
  if (!noise) {
    noise = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noise;
}
function burst({ dur = .5, freq = 400, gain = .5 }) {
  if (muted) return;
  const a = ac(), src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuffer(a); src.loop = true;
  f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(gain, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(); src.stop(a.currentTime + dur);
}
function tone({ f0 = 200, f1 = 60, dur = .3, gain = .3, type = 'sine' }) {
  if (muted) return;
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), a.currentTime + dur);
  g.gain.setValueAtTime(gain, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
const sfxFire = () => { burst({ dur: .2, freq: 850, gain: .4 }); tone({ f0: 300, f1: 60, dur: .25, gain: .35 }); };
const sfxBoom = () => { burst({ dur: .8, freq: 240, gain: .75 }); tone({ f0: 120, f1: 30, dur: .65, gain: .5 }); };
const sfxThud = () => tone({ f0: 90, f1: 40, dur: .16, gain: .25 });
const sfxWin  = () => [523, 659, 784, 1047].forEach((f, i) =>
  setTimeout(() => tone({ f0: f, f1: f, dur: .26, gain: .22, type: 'triangle' }), i * 110));

// The Scorched Earth shell whistle: a square-wave siren whose pitch tracks the
// shell's altitude, so it rises on the way up and falls on the way down.
let whistle = null;
function whistleStart() {
  if (muted || whistle) return;
  const a = ac(), o = a.createOscillator(), lp = a.createBiquadFilter(), g = a.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(190, a.currentTime);
  lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = .7;
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(.075, a.currentTime + .07);
  o.connect(lp); lp.connect(g); g.connect(a.destination);
  o.start();
  whistle = { o, g, a };
}
function whistleTrack(y) {
  if (!whistle) return;
  const alt = clamp((H - y) / (H * 0.92), 0, 1);          // 0 at ground, 1 at the top of the sky
  whistle.o.frequency.setTargetAtTime(190 + alt * 760, whistle.a.currentTime, .035);
}
function whistleStop() {
  if (!whistle) return;
  const { o, g, a } = whistle;
  whistle = null;
  g.gain.cancelScheduledValues(a.currentTime);
  g.gain.setValueAtTime(g.gain.value, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .07);
  o.stop(a.currentTime + .09);
}

// Aiming feedback. The angle dial ticks like a ratchet — one detent click per
// change, rate-limited so a fast sweep clatters instead of buzzing.
let lastTick = 0;
function sfxAngleTick() {
  if (muted) return;
  const now = ac().currentTime;
  if (now - lastTick < .028) return;
  lastTick = now;
  tone({ f0: 2100, f1: 1400, dur: .03, gain: .12, type: 'square' });
}

// The power dial hums at a pitch that tracks the stored energy: low and quiet
// at 10, high at 100. One oscillator is retuned while power keeps changing and
// fades out shortly after the last change.
let ptone = null, ptoneTimer = 0;
const powerHz = p => 75 * 2 ** (2.5 * (p - 10) / 90);    // 75 Hz → ~425 Hz
function sfxPowerTone(p) {
  if (muted) return;
  const a = ac();
  if (!ptone) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(powerHz(p), a.currentTime);
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(.14, a.currentTime + .03);
    o.connect(g); g.connect(a.destination);
    o.start();
    ptone = { o, g, a };
  }
  ptone.o.frequency.setTargetAtTime(powerHz(p), a.currentTime, .02);
  clearTimeout(ptoneTimer);
  ptoneTimer = setTimeout(powerToneStop, 180);
}
function powerToneStop() {
  clearTimeout(ptoneTimer);
  if (!ptone) return;
  const { o, g, a } = ptone;
  ptone = null;
  g.gain.cancelScheduledValues(a.currentTime);
  g.gain.setValueAtTime(g.gain.value, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .06);
  o.stop(a.currentTime + .08);
}

// ------------------------------------------------------------------ game state
const G = {
  terrain: new Float32Array(W),
  burn: new Uint8Array(W),          // columns scorched by a blast (drawn without grass)
  tanks: [],
  cur: 0,                           // whose turn
  starter: 0,                       // who opened this round
  round: 1,
  state: 'setup',                   // setup | aim | fly | boom | settle | over
  shell: null,
  trail: [],
  parts: [],
  shake: 0,
  timer: 0,
  killed: false,                    // did the last blast knock anyone out?
  clouds: [],
  drag: null,                       // live touch/mouse aim point, in logical coords
};

const aliveTanks = () => G.tanks.filter(t => !t.dead);
function nextAlive(from) {
  for (let k = 1; k <= G.tanks.length; k++) {
    const i = (from + k) % G.tanks.length;
    if (!G.tanks[i].dead) return i;
  }
  return from;
}

// ------------------------------------------------------------------ terrain
function generateTerrain() {
  const t = G.terrain;
  // The surface lives in a band that stops short of the floating control bar.
  // Hills are scaled to whatever band we get, rather than clipped flat by it.
  const top = H * 0.20;
  const floor = H - 46 - clamp(view.inset, 0, H * 0.34);
  const band = Math.max(80, floor - top);
  const k = band / (H - 46 - top);              // 1 on a full-height screen

  const layers = [
    { amp: rand(60, 105) * k, len: rand(760, 1150) },
    { amp: rand(28, 58) * k,  len: rand(300, 520) },
    { amp: rand(11, 24) * k,  len: rand(120, 210) },
    { amp: rand(4, 9) * k,    len: rand(46, 84) },
  ];
  const phase = layers.map(() => Math.random() * Math.PI * 2);
  const base = top + band * 0.57;
  for (let x = 0; x < W; x++) {
    let y = base;
    for (let i = 0; i < layers.length; i++) {
      y -= layers[i].amp * Math.sin((x / layers[i].len) * Math.PI * 2 + phase[i]);
    }
    t[x] = clamp(y, top, floor);
  }
  G.burn.fill(0);
  markTerrainDirty();
}

// Level a landing pad so a tank sits flat instead of clipping into a slope.
function flatten(cx, half) {
  const t = G.terrain;
  let sum = 0;
  for (let i = -half; i <= half; i++) sum += t[ix(cx + i)];
  const avg = sum / (half * 2 + 1);
  for (let i = -half; i <= half; i++) {
    const j = ix(cx + i);
    const w = 1 - Math.abs(i) / (half + 1);          // blend to avoid a hard step
    t[j] = t[j] * (1 - w) + avg * w;
  }
  markTerrainDirty();
}

function carveCrater(cx, cy, r) {
  const t = G.terrain;
  // Even a zero-radius shell leaves a scorch mark, so a near miss still shows
  // the child exactly where it landed.
  const mark = Math.max(r, 9);
  for (let i = -mark; i <= mark; i++) {
    const x = Math.round(cx + i);
    if (x < 0 || x >= W) continue;
    if (r > 0 && Math.abs(i) <= r) {
      const bottom = cy + Math.sqrt(Math.max(0, r * r - i * i));
      if (bottom > t[x]) t[x] = Math.min(bottom, BEDROCK);
    }
    G.burn[x] = 1;
  }
  markTerrainDirty();
}

// Terrain tilt under a tank, so the hull follows the ground.
function slopeAt(x) {
  const d = (G.terrain[ix(x + 14)] - G.terrain[ix(x - 14)]) / 28;
  return clamp(Math.atan(d), -0.55, 0.55);
}
// Barrel pivot sits on the turret, which rides the tilted hull.
function pivotOf(tk) {
  const r = tk.resting ? slopeAt(tk.x) : 0;
  const up = 18 * tankScale;
  return { x: tk.x + up * Math.sin(r), y: tk.y - up * Math.cos(r), rot: r };
}
// Centre of mass, i.e. what a shell has to hit.
const coreY = tk => tk.y - 14 * tankScale;
const aimDir = tk => ({ x: Math.cos(tk.angle * Math.PI / 180), y: -Math.sin(tk.angle * Math.PI / 180) });

// ------------------------------------------------------------------ rounds
function newRound(advanceStarter) {
  generateTerrain();

  // Spread the players across the full width — the outermost two start near
  // opposite edges — then jitter within a fraction of the gap, so every round
  // looks different without ever bunching everyone into the middle.
  const n = G.tanks.length;
  const margin = 70, usable = W - margin * 2;
  const step = n > 1 ? usable / (n - 1) : 0;
  const wobble = n > 1 ? step * 0.18 : usable * 0.25;

  const xs = G.tanks.map((_, i) =>
    clamp((n > 1 ? margin + step * i : W / 2) + rand(-wobble, wobble), margin, W - margin));

  // Never let jitter pull two tanks within a blast of each other.
  const minGap = Math.min(step * 0.75, Math.max(blastR * 3, 76 * tankScale));
  for (let i = 1; i < xs.length; i++) {
    if (xs[i] - xs[i - 1] < minGap) xs[i] = Math.min(xs[i - 1] + minGap, W - margin);
  }

  G.tanks.forEach((tk, i) => {
    tk.x = Math.round(xs[i]);
    flatten(tk.x, Math.round(26 * tankScale));
    tk.y = G.terrain[ix(tk.x)];
    tk.vy = 0; tk.dead = false; tk.resting = true;
    // Aim inwards to start: left half points right, right half points left.
    tk.angle = tk.x < W / 2 ? 45 : 135;
  });

  if (advanceStarter) G.starter = (G.starter + 1) % n;
  G.cur = G.starter;
  G.state = 'aim';
  G.shell = null; G.trail = []; G.parts = []; G.shake = 0; G.killed = false; G.drag = null;
  whistleStop();
  G.clouds = Array.from({ length: 5 }, () => ({
    x: rand(0, W), y: rand(40, 200), s: rand(.55, 1.15), sp: rand(3, 8),
  }));
  hideBanner();
  syncUI();
}

function startGame(names) {
  G.tanks = names.map((name, i) => ({
    x: 0, y: 0, vy: 0, angle: 45, power: 60,
    name: name || PALETTE[i].name, colour: PALETTE[i].colour, dark: PALETTE[i].dark,
    score: 0, dead: false, resting: true,
  }));
  G.round = 1; G.starter = 0;
  buildScoreboard();
  newRound(false);
}

// ------------------------------------------------------------------ firing
function fire() {
  if (G.state !== 'aim') return;
  const tk = G.tanks[G.cur];
  const p = pivotOf(tk), d = aimDir(tk);
  const speed = tk.power * MUZZLE_V;
  const muzzle = 34 * tankScale;
  G.shell = { x: p.x + d.x * muzzle, y: p.y + d.y * muzzle, vx: d.x * speed, vy: d.y * speed };
  G.trail = [{ x: G.shell.x, y: G.shell.y }];
  G.drag = null;
  G.state = 'fly';
  G.timer = 0;
  powerToneStop();
  sfxFire();
  whistleStart();
  syncUI();
}

// One physics step. Returns true when the shell has finished its flight.
function stepShell(h) {
  const s = G.shell;
  s.vy += GRAV * h;
  s.x += s.vx * h;
  s.y += s.vy * h;

  // Direct hit on any tank still in the game.
  for (const tk of G.tanks) {
    if (!tk.dead && Math.hypot(s.x - tk.x, s.y - coreY(tk)) < TANK_R * tankScale) {
      impact(s.x, s.y, tk); return true;
    }
  }
  // Ground — including the extended ground drawn past the world edges (§2), so
  // a shell can never fly through scenery the player can see. Beyond the screen
  // there is nothing to look wrong, and a shell out there may still blow back.
  const solidFrom = Math.min(0, view.x0) - 4, solidTo = Math.max(W, view.x1) + 4;
  if (s.x >= solidFrom && s.x <= solidTo && s.y >= G.terrain[ix(s.x)]) {
    impact(s.x, G.terrain[ix(s.x)]);
    return true;
  }
  // Gone for good — off the bottom or well outside the field.
  if (s.y > H + 300 || s.x < -900 || s.x > W + 900) {
    G.shell = null; whistleStop(); endTurn(); return true;
  }
  return false;
}

function impact(x, y, direct) {
  G.shell = null;
  whistleStop();

  // Resolve the blast against tank positions before the ground changes shape.
  // At zero radius there is no splash at all: only the tank the shell actually
  // struck is destroyed, so a direct hit becomes the only way to win.
  G.killed = false;
  const reach = blastR > 0 ? blastR + TANK_R * .6 * tankScale : 0;
  for (const tk of G.tanks) {
    if (tk.dead) continue;
    const caught = tk === direct
      || (reach > 0 && Math.hypot(x - tk.x, y - coreY(tk)) < reach);
    if (caught) { tk.dead = true; G.killed = true; }
  }

  carveCrater(x, y, blastR);
  spawnExplosion(x, y);
  for (const tk of G.tanks) if (tk.y < G.terrain[ix(tk.x)] - 0.5) tk.resting = false;

  G.shake = 8 + blastR * .17;
  G.state = 'boom';
  G.timer = 0;
  sfxBoom();
  syncUI();
}

function spawnExplosion(x, y) {
  const r = Math.max(blastR, 14);
  const k = r / 48;
  for (let i = 0; i < Math.round(46 * clamp(k, .45, 1.3)); i++) {
    const a = rand(0, Math.PI * 2), sp = rand(40, 320) * clamp(k, .5, 1.4);
    G.parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: rand(.35, .95), max: 1, r: rand(2, 7),
      c: ['#fff3b0', '#ffb03a', '#ff6a2a', '#8a5a34'][(Math.random() * 4) | 0],
    });
  }
  G.parts.push({ flash: true, x, y, life: .26, max: .26, r: r * 1.7 });
}

const scoreLine = () => G.tanks.map(t => `${t.name} ${t.score}`).join(' · ');

function endTurn() {
  const alive = aliveTanks();
  if (alive.length <= 1) {
    G.state = 'over';
    if (alive.length === 1) {
      alive[0].score++;
      sfxWin();
      showBanner(`${alive[0].name} WINS!`, `Round ${G.round} — ${scoreLine()}`, alive[0].colour);
    } else {
      showBanner('DRAW!', `Round ${G.round} — ${scoreLine()}`, '#ffd54a');
    }
  } else {
    G.cur = nextAlive(G.cur);
    G.state = 'aim';
  }
  syncUI();
}

// ------------------------------------------------------------------ main loop
let last = performance.now(), acc = 0;
const STEP = 1 / 300;

// Most of a turn is spent with the player thinking, and repainting a full
// screen 60 times a second to show nothing new is the single most expensive
// thing this game can do. So: paint every frame while something is actually
// moving, and otherwise tick over slowly just to drift the clouds. Any input
// that changes what is on screen asks for an immediate frame.
const IDLE_FPS = 10;
let needsDraw = true, lastDraw = 0;
const requestDraw = () => { needsDraw = true; };

function frame(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  update(dt);

  const animating = G.state === 'fly' || G.state === 'boom' || G.state === 'settle'
    || G.parts.length > 0 || G.shake > 0;
  if (animating || needsDraw || now - lastDraw >= 1000 / IDLE_FPS) {
    draw();
    lastDraw = now;
    needsDraw = false;
  }
  requestAnimationFrame(frame);
}

function update(dt) {
  for (const c of G.clouds) {
    c.x += c.sp * dt;
    if (c.x > view.x1 + 160) c.x = view.x0 - 160;
    else if (c.x < view.x0 - 160) c.x = view.x1 + 160;
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 42);

  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    if (!p.flash) { p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    if (p.life <= 0) G.parts.splice(i, 1);
  }

  if (G.state === 'fly' && G.shell) {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && G.state === 'fly' && guard++ < 400) {
      acc -= STEP;
      if (stepShell(STEP)) break;
      const t = G.trail[G.trail.length - 1];
      if (!t || Math.hypot(G.shell.x - t.x, G.shell.y - t.y) > 5) {
        G.trail.push({ x: G.shell.x, y: G.shell.y });
        if (G.trail.length > 900) G.trail.shift();
      }
    }
    if (G.shell) whistleTrack(G.shell.y);
  } else {
    acc = 0;
  }

  if (G.state === 'boom') {
    G.timer += dt;
    if (G.timer > .45) { G.state = 'settle'; G.timer = 0; }
  }

  if (G.state === 'settle') {
    let moving = false;
    for (const tk of G.tanks) {
      const ground = G.terrain[ix(tk.x)];
      if (tk.y < ground - 0.5) {
        tk.resting = false;
        tk.vy += GRAV * 2.2 * dt;
        tk.y = Math.min(tk.y + tk.vy * dt, ground);
        moving = true;
      } else if (!tk.resting) {
        tk.y = ground;
        if (tk.vy > 120) sfxThud();
        tk.vy = 0; tk.resting = true;
      }
    }
    G.timer += dt;
    if (!moving && G.timer > .25) endTurn();
  }
}

// ------------------------------------------------------------------ drawing
function draw() {
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake) * .35, rand(-G.shake, G.shake) * .35);

  drawSky();
  drawTerrain();
  for (const tk of G.tanks) drawTank(tk);
  if (G.state === 'aim') drawAim(G.tanks[G.cur]);
  drawTrail();
  if (G.shell) drawShell();
  drawParticles();

  ctx.restore();
}

// Gradients are rebuilt only when their geometry changes, not every frame.
let skyGrad = null, skyGradTop = NaN, dirtGrad = null;
function skyGradient() {
  const top = Math.min(0, view.y0);
  if (!skyGrad || top !== skyGradTop) {
    skyGrad = ctx.createLinearGradient(0, top, 0, H);
    skyGrad.addColorStop(0, '#4fa8dd'); skyGrad.addColorStop(.55, '#93d3f0'); skyGrad.addColorStop(1, '#d7f0fb');
    skyGradTop = top;
  }
  return skyGrad;
}
function dirtGradient() {
  if (!dirtGrad) {
    dirtGrad = ctx.createLinearGradient(0, H * .3, 0, H);
    dirtGrad.addColorStop(0, '#9c6237'); dirtGrad.addColorStop(1, '#5d3a21');
  }
  return dirtGrad;
}

function drawSky() {
  ctx.fillStyle = skyGradient();
  ctx.fillRect(view.x0 - 40, view.y0 - 40, (view.x1 - view.x0) + 80, (view.y1 - view.y0) + 80);

  ctx.fillStyle = '#ffe066';
  ctx.beginPath(); ctx.arc(W - 130, 100, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,224,102,.28)';
  ctx.beginPath(); ctx.arc(W - 130, 100, 72, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (const c of G.clouds) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    ctx.beginPath();
    ctx.arc(-40, 6, 26, 0, Math.PI * 2);
    ctx.arc(0, -8, 36, 0, Math.PI * 2);
    ctx.arc(42, 6, 28, 0, Math.PI * 2);
    ctx.rect(-40, 6, 82, 22);
    ctx.fill();
    ctx.restore();
  }
}

// The battlefield is redrawn into an offscreen canvas only when it actually
// changes — a new round, or a crater — and blitted after that. Painting it
// column by column every frame was costing ~150k fillRect calls a second.
const terrainCv = document.createElement('canvas');
const tctx = terrainCv.getContext('2d');
let terrainQ = 0, terrainDirty = true;
const markTerrainDirty = () => { terrainDirty = true; };

function rebuildTerrain(q) {
  const t = G.terrain;
  terrainQ = q;
  terrainCv.width = Math.max(1, Math.ceil(W * q));
  terrainCv.height = Math.max(1, Math.ceil(H * q));
  tctx.setTransform(q, 0, 0, q, 0, 0);
  tctx.clearRect(0, 0, W, H);

  tctx.beginPath();
  tctx.moveTo(0, H);
  for (let x = 0; x < W; x++) tctx.lineTo(x, t[x]);
  tctx.lineTo(W, H);
  tctx.closePath();
  const g = tctx.createLinearGradient(0, H * .3, 0, H);
  g.addColorStop(0, '#9c6237'); g.addColorStop(1, '#5d3a21');
  tctx.fillStyle = g; tctx.fill();

  // Surface skin: grass where untouched, scorched dirt where a shell landed.
  for (let x = 0; x < W; x++) {
    if (G.burn[x]) { tctx.fillStyle = '#4b3020'; tctx.fillRect(x, t[x], 1, 7); }
    else {
      tctx.fillStyle = '#63c53f'; tctx.fillRect(x, t[x], 1, 11);
      tctx.fillStyle = '#3f9a27'; tctx.fillRect(x, t[x] + 11, 1, 5);
    }
  }
  terrainDirty = false;
}

function drawTerrain() {
  const t = G.terrain;
  const q = clamp(view.s * Math.min(window.devicePixelRatio || 1, 2), .5, 2);
  if (terrainDirty || Math.abs(q - terrainQ) > .01) rebuildTerrain(q);

  const dirt = dirtGradient();

  // Everything below the world is bedrock, so it is one rectangle.
  if (view.y1 > H) {
    ctx.fillStyle = dirt;
    ctx.fillRect(view.x0 - 4, H - 1, (view.x1 - view.x0) + 8, (view.y1 - H) + 8);
  }

  ctx.drawImage(terrainCv, 0, 0, W, H);

  // Overscan: the edge column carried outwards so the ground reaches the screen
  // edge. It is flat by construction, so it is a couple of rects, not a loop.
  const edge = (x0, x1, col) => {
    if (x1 <= x0) return;
    const y = t[col], w = x1 - x0;
    ctx.fillStyle = dirt; ctx.fillRect(x0, y, w, (view.y1 + 8) - y);
    if (G.burn[col]) { ctx.fillStyle = '#4b3020'; ctx.fillRect(x0, y, w, 7); }
    else {
      ctx.fillStyle = '#63c53f'; ctx.fillRect(x0, y, w, 11);
      ctx.fillStyle = '#3f9a27'; ctx.fillRect(x0, y + 11, w, 5);
    }
  };
  // Overlap the blit by a unit at each side, or antialiasing leaves a seam.
  edge(view.x0 - 4, 1, 0);
  edge(W - 1, view.x1 + 4, W - 1);
}

function drawTank(tk) {
  const rot = tk.resting ? slopeAt(tk.x) : 0;
  const c = tk.dead ? '#4a4a4a' : tk.colour;
  const d = tk.dead ? '#2c2c2c' : tk.dark;
  const ts = tankScale;

  ctx.save();
  ctx.translate(tk.x, tk.y);
  ctx.rotate(rot);
  ctx.scale(ts, ts);
  tankBody(ctx, c, d);
  ctx.restore();

  // Barrel is drawn in world space so it always shows the true firing angle.
  const p = pivotOf(tk), dir = aimDir(tk);
  paintBarrel(ctx, p.x, p.y, dir.x, dir.y, 34 * ts, c, d, 6 * ts);

  // Name plate, so 3- and 4-player games stay legible. Grows as the world
  // shrinks, so it stays readable on a small phone screen.
  const fs = Math.round(17 / clamp(view.s / 0.85, 0.5, 1));
  const top = tk.y - 46 * ts;
  ctx.font = `700 ${fs}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.45)';
  ctx.strokeText(tk.name, tk.x, top - fs * .4);
  ctx.fillStyle = tk.dead ? '#9aa6b3' : '#fff';
  ctx.fillText(tk.name, tk.x, top - fs * .4);

  // Knocked out: a drawn cross, not an emoji — no font to depend on.
  if (tk.dead) {
    const cy = top - fs * 1.9, r = fs * .55;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = fs * .42;
    for (const pass of [0, 1]) {
      ctx.beginPath();
      ctx.moveTo(tk.x - r, cy - r); ctx.lineTo(tk.x + r, cy + r);
      ctx.moveTo(tk.x + r, cy - r); ctx.lineTo(tk.x - r, cy + r);
      ctx.stroke();
      ctx.strokeStyle = '#e8edf3'; ctx.lineWidth = fs * .24;
      if (pass) break;
    }
    ctx.restore();
  }
}

function drawAim(tk) {
  const p = pivotOf(tk), d = aimDir(tk);
  const start = 42 * tankScale;
  // Fixed length (what full power used to draw): the line is an angle guide,
  // not a power gauge — the power slider's fill already shows the energy.
  const len = start + 4 + 85;
  ctx.save();
  ctx.setLineDash([9, 11]);
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath();
  ctx.moveTo(p.x + d.x * start, p.y + d.y * start);
  ctx.lineTo(p.x + d.x * len, p.y + d.y * len);
  ctx.stroke();
  ctx.restore();

  // Reticle under the finger while dragging to aim.
  if (G.drag) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(G.drag.x, G.drag.y, 22, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(G.drag.x - 32, G.drag.y); ctx.lineTo(G.drag.x - 12, G.drag.y);
    ctx.moveTo(G.drag.x + 12, G.drag.y); ctx.lineTo(G.drag.x + 32, G.drag.y);
    ctx.moveTo(G.drag.x, G.drag.y - 32); ctx.lineTo(G.drag.x, G.drag.y - 12);
    ctx.moveTo(G.drag.x, G.drag.y + 12); ctx.lineTo(G.drag.x, G.drag.y + 32);
    ctx.stroke();
    ctx.restore();
  }
}

function drawTrail() {
  if (G.trail.length < 2) return;
  ctx.save();
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath();
  ctx.moveTo(G.trail[0].x, G.trail[0].y);
  for (let i = 1; i < G.trail.length; i++) ctx.lineTo(G.trail[i].x, G.trail[i].y);
  ctx.stroke();
  ctx.restore();
}

function drawShell() {
  const s = G.shell;
  ctx.fillStyle = '#22303d';
  ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath(); ctx.arc(s.x - 2, s.y - 2, 3, 0, Math.PI * 2); ctx.fill();
}

function drawParticles() {
  for (const p of G.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.flash) {
      ctx.fillStyle = `rgba(255,238,170,${a * .85})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.15 - a * .35), 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// The hull, treads and turret in tank-local units, origin at the centre of the
// tracks. Shared by the battlefield and the setup screen's size preview.
function tankBody(c, colour, dark) {
  c.fillStyle = 'rgba(0,0,0,.22)';
  c.beginPath(); c.ellipse(0, 1, 34, 6, 0, 0, Math.PI * 2); c.fill();

  c.fillStyle = '#2c3440';
  roundRect(c, -32, -14, 64, 14, 7); c.fill();
  c.fillStyle = '#59646f';
  for (let i = -3; i <= 3; i++) { c.beginPath(); c.arc(i * 9, -7, 3.4, 0, Math.PI * 2); c.fill(); }

  c.fillStyle = colour;
  roundRect(c, -26, -30, 52, 18, 6); c.fill();
  c.fillStyle = dark;
  roundRect(c, -26, -17, 52, 5, 2.5); c.fill();

  c.fillStyle = colour;
  c.beginPath(); c.arc(0, -30, 13, Math.PI, 0); c.fill();
  c.fillStyle = 'rgba(255,255,255,.28)';
  c.beginPath(); c.arc(-4, -33, 4.5, 0, Math.PI * 2); c.fill();
}

// A barrel of length `len` from (px,py) along (dx,dy), in whatever space the
// context is currently in.
function paintBarrel(c, px, py, dx, dy, len, colour, dark, w) {
  c.save();
  c.lineCap = 'round';
  c.strokeStyle = dark; c.lineWidth = w * 1.85;
  c.beginPath(); c.moveTo(px, py); c.lineTo(px + dx * (len + w * .35), py + dy * (len + w * .35)); c.stroke();
  c.strokeStyle = colour; c.lineWidth = w;
  c.beginPath(); c.moveTo(px, py); c.lineTo(px + dx * len, py + dy * len); c.stroke();
  c.restore();
}

// ------------------------------------------------------------------ touch / mouse aiming
// Undo the camera transform to get world coordinates from a pointer event.
function toLogical(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left - view.offX) / view.s,
    y: (clientY - r.top - view.offY) / view.s,
  };
}

// Drag anywhere on the field: direction sets the angle, distance sets the power.
function aimAt(px, py) {
  const tk = G.tanks[G.cur];
  const p = pivotOf(tk);
  const dx = px - p.x, dy = py - p.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 12) return;
  const a0 = tk.angle, p0 = tk.power;
  tk.angle = Math.round(clamp(Math.atan2(-dy, dx) * 180 / Math.PI, 0, 180));
  tk.power = Math.round(clamp(10 + (dist - 60) * 90 / 340, 10, 100));
  if (tk.angle !== a0) sfxAngleTick();
  if (tk.power !== p0) sfxPowerTone(tk.power);
  G.drag = { x: px, y: py };
  requestDraw();
  syncUI();
}

cv.addEventListener('pointerdown', e => {
  if (G.state !== 'aim') return;
  cv.setPointerCapture(e.pointerId);
  const p = toLogical(e.clientX, e.clientY);
  aimAt(p.x, p.y);
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (G.state !== 'aim' || !cv.hasPointerCapture(e.pointerId)) return;
  const p = toLogical(e.clientX, e.clientY);
  aimAt(p.x, p.y);
  e.preventDefault();
});
const endDrag = e => {
  if (cv.hasPointerCapture?.(e.pointerId)) cv.releasePointerCapture(e.pointerId);
  G.drag = null;
  requestDraw();
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ------------------------------------------------------------------ UI wiring
const angleEl = el('angle'), powerEl = el('power'), fireBtn = el('fire');
const banner = el('banner');

function buildScoreboard() {
  el('scores').innerHTML = G.tanks.map((t, i) => `
    <div class="score" data-i="${i}">
      <span class="chip" style="background:${t.colour}"></span>
      <span class="num" style="color:${t.colour}">0</span>
      <span class="name"></span>
    </div>`).join('');
  G.tanks.forEach((t, i) => {
    el('scores').children[i].querySelector('.name').textContent = t.name;
  });
}

function syncUI() {
  if (!G.tanks.length) return;
  requestDraw();
  const tk = G.tanks[G.cur];
  const aiming = G.state === 'aim';

  angleEl.value = tk.angle; powerEl.value = tk.power;
  el('angleRead').textContent = tk.angle;
  el('powerRead').textContent = tk.power;
  // Two shades of the player's colour: a pale one for angle, the full colour
  // for power — plus power fills in from the left, so how "full" the shot is
  // can be read at a glance without reading the number.
  angleEl.style.setProperty('--accent', tint(tk.colour, .5));
  angleEl.style.setProperty('--p', (180 - tk.angle) / 180);
  powerEl.style.setProperty('--accent', tk.colour);
  powerEl.style.setProperty('--fill', tk.colour);
  powerEl.style.setProperty('--p', (tk.power - 10) / 90);
  angleEl.disabled = powerEl.disabled = !aiming;
  el('angleDown').disabled = !aiming || tk.angle >= 180;
  el('angleUp').disabled = !aiming || tk.angle <= 0;
  el('powerDown').disabled = !aiming || tk.power <= 10;
  el('powerUp').disabled = !aiming || tk.power >= 100;
  fireBtn.disabled = !aiming;
  fireBtn.style.background = tk.colour;
  fireBtn.style.boxShadow = `0 5px 0 ${tk.dark}`;

  el('turnChip').style.background = tk.colour;
  el('turnText').textContent = aiming ? `${tk.name}'s turn` :
    G.state === 'over' ? 'Round over' : 'Shell away…';

  const nodes = el('scores').children;
  G.tanks.forEach((t, i) => {
    const n = nodes[i];
    if (!n) return;
    n.querySelector('.num').textContent = t.score;
    n.classList.toggle('active', aiming && i === G.cur);
    n.classList.toggle('dead', t.dead);
  });

  el('roundVal').textContent = G.round;
}

function showBanner(title, text, colour) {
  el('bannerTitle').textContent = title;
  el('bannerTitle').style.color = colour || '#fff';
  el('bannerText').textContent = text;
  banner.hidden = false;
}
const hideBanner = () => { banner.hidden = true; };

angleEl.addEventListener('input', () => {
  G.tanks[G.cur].angle = +angleEl.value;
  sfxAngleTick();
  el('angleRead').textContent = angleEl.value;
  angleEl.style.setProperty('--p', (180 - +angleEl.value) / 180);
  requestDraw();
});
powerEl.addEventListener('input', () => {
  G.tanks[G.cur].power = +powerEl.value;
  sfxPowerTone(+powerEl.value);
  el('powerRead').textContent = powerEl.value;
  powerEl.style.setProperty('--p', (+powerEl.value - 10) / 90);
  requestDraw();
});
// A single step of the dial. syncUI does the rest: sliders, readouts, the
// power fill, the disabled states and a redraw.
function nudge(dial, delta) {
  if (G.state !== 'aim') return;
  const tk = G.tanks[G.cur];
  if (dial === 'angle') {
    const was = tk.angle;
    tk.angle = clamp(tk.angle + delta, 0, 180);
    if (tk.angle !== was) sfxAngleTick();
  } else {
    const was = tk.power;
    tk.power = clamp(tk.power + delta, 10, 100);
    if (tk.power !== was) sfxPowerTone(tk.power);
  }
  syncUI();
}

// Tap for one step; hold to keep going, which beats jabbing at it 40 times.
function holdToRepeat(btn, act) {
  let delay, timer;
  const stop = () => { clearTimeout(delay); clearInterval(timer); };
  btn.addEventListener('pointerdown', e => {
    if (btn.disabled) return;
    e.preventDefault();
    act();
    delay = setTimeout(() => { timer = setInterval(act, 55); }, 350);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  // detail === 0 means the click came from the keyboard, which sends no pointer
  // events — so this fires for Enter/Space only, never twice for a tap.
  btn.addEventListener('click', e => { if (e.detail === 0) act(); });
}
// − swings the barrel anti-clockwise (angle up), + clockwise (angle down),
// matching the reversed angle slider.
holdToRepeat(el('angleDown'), () => nudge('angle', 1));
holdToRepeat(el('angleUp'), () => nudge('angle', -1));
holdToRepeat(el('powerDown'), () => nudge('power', -1));
holdToRepeat(el('powerUp'), () => nudge('power', 1));

fireBtn.addEventListener('click', fire);

el('bannerBtn').addEventListener('click', () => { G.round++; newRound(true); });
el('bannerNew').addEventListener('click', showSetup);
el('newGame').addEventListener('click', showSetup);
el('sound').addEventListener('click', e => {
  muted = !muted;
  if (muted) { whistleStop(); powerToneStop(); }
  // The button shows what pressing it WILL do, not the current state: a
  // crossed-out speaker mutes, a speaker with sound waves unmutes.
  el('sndMute').toggleAttribute('hidden', muted);
  el('sndUnmute').toggleAttribute('hidden', !muted);
  const verb = muted ? 'Unmute' : 'Mute';
  e.currentTarget.title = verb;
  e.currentTarget.setAttribute('aria-label', verb);
  if (!muted) sfxThud();
});

// Full screen. The same button leaves it again, and the label follows the
// actual state so pressing Escape (or the system gesture) keeps it honest.
// iOS Safari has no element fullscreen at all, so the button hides itself
// rather than offering something that cannot work.
const fullBtn = el('full');
const canFull = document.fullscreenEnabled || !!document.documentElement.webkitRequestFullscreen;
if (!canFull) fullBtn.hidden = true;

fullBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const root = document.documentElement;
      await (root.requestFullscreen?.() ?? root.webkitRequestFullscreen?.());
    } else {
      await (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.());
    }
  } catch { /* the browser refused; the label resync below keeps things sane */ }
});

function syncFullLabel() {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  fullBtn.classList.toggle('on', on);                 // swaps the glyph
  el('fullLabel').textContent = on ? 'Exit Full Screen' : 'Full Screen';
  fullBtn.title = on ? 'Leave full screen' : 'Full screen';
  relayout();
}
document.addEventListener('fullscreenchange', syncFullLabel);
document.addEventListener('webkitfullscreenchange', syncFullLabel);

addEventListener('keydown', e => {
  if (G.state === 'setup') return;
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;   // let buttons handle their own space
  if (G.state !== 'aim') {
    if (e.key === 'Enter' && G.state === 'over') { G.round++; newRound(true); e.preventDefault(); }
    return;
  }
  const tk = G.tanks[G.cur];
  const step = e.shiftKey ? 5 : 1;
  const a0 = tk.angle, p0 = tk.power;
  switch (e.key) {
    case 'ArrowLeft':  tk.angle = clamp(tk.angle + step, 0, 180); break;
    case 'ArrowRight': tk.angle = clamp(tk.angle - step, 0, 180); break;
    case 'ArrowUp':    tk.power = clamp(tk.power + step, 10, 100); break;
    case 'ArrowDown':  tk.power = clamp(tk.power - step, 10, 100); break;
    case ' ': case 'Enter': fire(); e.preventDefault(); return;
    default: return;
  }
  if (tk.angle !== a0) sfxAngleTick();
  if (tk.power !== p0) sfxPowerTone(tk.power);
  e.preventDefault();
  syncUI();
});

// ------------------------------------------------------------------ setup screen
const setupEl = el('setup');

const names = PALETTE.map(p => p.name);      // remembered as the count changes

function renderPlayers() {

    <label class="pcard" style="--c:${p.colour}">
      <span class="chip"></span>

             autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Player ${i + 1} name">
    </label>`).join('');

// `.pill[data-n]` and not just `.pill`: the tank-size +/- buttons are pills too.
el('setup').querySelectorAll('.pill[data-n]').forEach(btn => {

// A little diorama of one tank at the chosen size, so the choice is visible
// rather than a number.
const previewCv = el('sizePreview'), pctx = previewCv.getContext('2d');
const BIGGEST = TANK_SIZES[TANK_SIZES.length - 1];

// The preview is drawn at exactly the scale the battlefield uses (view.s), so
// the tank shown here is the same number of pixels as the tank you play with.
// The frame is sized to hold the largest option, so switching sizes never
// rescales the picture — only the tank grows.
function drawSizePreview() {
  const s = view.s;
  const biggestBlast = BLAST_SIZES[BLAST_SIZES.length - 1];
  // Sized for the largest of either setting, so the frame never jumps as the
  // player steps through the options — only what is drawn inside it changes.
  const boxW = Math.round(clamp(Math.max(64 * BIGGEST, 2 * biggestBlast) * s + 46, 130, 340));
  const boxH = Math.round(clamp(Math.max(46 * BIGGEST, biggestBlast + 24) * s + 34, 78, 210));
  previewCv.style.width = boxW + 'px';
  previewCv.style.height = boxH + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  previewCv.width = Math.round(boxW * dpr);
  previewCv.height = Math.round(boxH * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const sky = pctx.createLinearGradient(0, 0, 0, boxH);
  sky.addColorStop(0, '#4fa8dd'); sky.addColorStop(1, '#cfeaf8');
  pctx.fillStyle = sky; pctx.fillRect(0, 0, boxW, boxH);

  const gy = boxH - 13;
  pctx.fillStyle = '#7a4c2b'; pctx.fillRect(0, gy, boxW, boxH - gy);
  pctx.fillStyle = '#63c53f'; pctx.fillRect(0, gy, boxW, 5);
  pctx.fillStyle = '#3f9a27'; pctx.fillRect(0, gy + 5, boxW, 2);

  const ts = tankScale * s;                 // identical to the battlefield
  const cx = boxW / 2, core = gy + 1 - 14 * ts;

  // How near a shell has to land to be lethal, drawn at the same scale.
  if (blastR > 0) {
    pctx.save();
    pctx.beginPath(); pctx.arc(cx, core, blastR * s, 0, Math.PI * 2);
    pctx.fillStyle = 'rgba(255,120,40,.20)'; pctx.fill();
    pctx.setLineDash([6, 6]); pctx.lineWidth = 2; pctx.strokeStyle = 'rgba(255,120,40,.95)';
    pctx.stroke();
    pctx.restore();
  }

  const { colour, dark } = PALETTE[0];
  pctx.save();
  pctx.translate(cx, gy + 1);
  pctx.scale(ts, ts);
  tankBody(pctx, colour, dark);
  pctx.restore();

  const a = 45 * Math.PI / 180;
  paintBarrel(pctx, cx, gy + 1 - 18 * ts, Math.cos(a), -Math.sin(a), 34 * ts, colour, dark, 6 * ts);

  // Zero radius: mark the tank itself as the only target.
  if (blastR === 0) {
    pctx.save();
    pctx.strokeStyle = 'rgba(255,120,40,.95)'; pctx.lineWidth = 2;
    const r = 13 * ts + 5;
    pctx.beginPath(); pctx.arc(cx, core, r, 0, Math.PI * 2); pctx.stroke();
    pctx.beginPath();
    pctx.moveTo(cx - r - 6, core); pctx.lineTo(cx - r + 3, core);
    pctx.moveTo(cx + r - 3, core); pctx.lineTo(cx + r + 6, core);
    pctx.moveTo(cx, core - r - 6); pctx.lineTo(cx, core - r + 3);
    pctx.moveTo(cx, core + r - 3); pctx.lineTo(cx, core + r + 6);
    pctx.stroke();
    pctx.restore();
  }
  previewScale = ts;
}
let previewScale = 0;

function setBlast(i) {
  blastIdx = clamp(i, 0, BLAST_SIZES.length - 1);
  blastR = BLAST_SIZES[blastIdx];
  el('blastVal').textContent = blastR;
  el('blastNote').hidden = blastR !== 0;
  el('blastDown').disabled = blastIdx === 0;
  el('blastUp').disabled = blastIdx === BLAST_SIZES.length - 1;
  drawSizePreview();
}
el('blastDown').addEventListener('click', () => setBlast(blastIdx - 1));
el('blastUp').addEventListener('click', () => setBlast(blastIdx + 1));

function setSize(i) {
  sizeIdx = clamp(i, 0, TANK_SIZES.length - 1);
  tankScale = TANK_SIZES[sizeIdx];
  el('sizeVal').textContent = tankScale.toFixed(2).replace(/0$/, '') + '\u00d7';
  el('sizeDown').disabled = sizeIdx === 0;
  el('sizeUp').disabled = sizeIdx === TANK_SIZES.length - 1;
  drawSizePreview();
}
el('sizeDown').addEventListener('click', () => setSize(sizeIdx - 1));
el('sizeUp').addEventListener('click', () => setSize(sizeIdx + 1));

function showSetup() {
  G.state = 'setup';
  whistleStop();
  hideBanner();
  setupEl.hidden = false;
  drawSizePreview();
}

el('start').addEventListener('click', () => {
  const chosen = PALETTE.slice(0, playerCount)
    .map((p, i) => (names[i] || '').trim().slice(0, 10) || p.name);
  setupEl.hidden = true;
  ac();                                       // unlock audio on this user gesture
  startGame(chosen);
});

// ------------------------------------------------------------------ boot
// `short` drives the compact layout where the controls float over the field —
// a phone on its side. Portrait has height to spare, so it keeps the controls
// in the normal flow below the battlefield.
const coarse = matchMedia('(pointer:coarse)');
function applyLayout() {
  document.documentElement.classList.toggle('short', innerHeight <= 560);
}

function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // Layout size, not getBoundingClientRect: the latter reports the rotated
  // box, with width and height swapped.
  const cssW = Math.max(1, cv.clientWidth), cssH = Math.max(1, cv.clientHeight);

  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);

  const s = Math.min(cssW / W, cssH / H);          // contain: the whole world stays visible
  view.s = s;
  view.offX = (cssW - W * s) / 2;
  // Sit the world low in the frame rather than centring it. On a tall screen
  // the spare height then becomes sky — which shells actually fly through —
  // instead of a dead band of dirt under the battlefield.
  view.offY = (cssH - H * s) * 0.8;
  view.x0 = -view.offX / s;  view.x1 = (cssW - view.offX) / s;
  view.y0 = -view.offY / s;  view.y1 = (cssH - view.offY) / s;

  // How much world the floating control bar covers, when it is floating.
  const bar = document.querySelector('.controls');
  view.inset = document.documentElement.classList.contains('short')
    ? (bar.offsetHeight + 10) / s
    : 0;

  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * view.offX, dpr * view.offY);
  requestDraw();                                   // the canvas was just cleared
}
const relayout = () => {
  applyLayout();
  fitCanvas();
  if (!setupEl.hidden) drawSizePreview();      // view.s may have changed
};
addEventListener('resize', relayout);
addEventListener('orientationchange', relayout);
coarse.addEventListener?.('change', relayout);
new ResizeObserver(fitCanvas).observe(cv);        // catches layout changes too

// Handle for the browser console and the Playwright smoke test.
window.__debug = {
  G, view, fire, newRound, startGame,
  worldW: () => W, worldH: () => H,
  tankScale: () => tankScale, sizeIdx: () => sizeIdx, sizes: () => TANK_SIZES.slice(),
  blastR: () => blastR, blastIdx: () => blastIdx, blasts: () => BLAST_SIZES.slice(),
  previewScale: () => previewScale, gameTankScale: () => tankScale * view.s,
  powerToneAlive: () => !!ptone,
};

applyLayout();
fitCanvas();
renderPlayers();
setSize(sizeIdx);
setBlast(blastIdx);
generateTerrain();                            // backdrop behind the setup screen
startGame([PALETTE[0].name, PALETTE[1].name]);
showSetup();                                  // ...but start on the setup screen
if (matchMedia('(pointer:coarse)').matches) el('hint').textContent = 'DRAG TO AIM · 1 HIT = OUT';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
