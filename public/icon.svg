<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: a red tank on a grassy hill, the same shapes tankBody() and
       paintBarrel() draw in the game. Full-bleed, with the tank inside the
       central 80% so it also works as a maskable icon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa8dd"/>
      <stop offset=".55" stop-color="#93d3f0"/>
      <stop offset="1" stop-color="#d7f0fb"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6237"/>
      <stop offset="1" stop-color="#5d3a21"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="132" cy="122" r="34" fill="#fff6c8"/>
  <path d="M0 352 Q128 318 256 334 T512 330 V512 H0 Z" fill="url(#dirt)"/>
  <path d="M0 352 Q128 318 256 334 T512 330" fill="none" stroke="#5fae3c" stroke-width="14"/>
  <!-- tank, tank-local units scaled 4.2x, track centre at (256, 334) -->
  <g transform="translate(256 334) scale(4.2)">
    <line x1="0" y1="-30" x2="21" y2="-51" stroke="#a32a22" stroke-width="9.25" stroke-linecap="round"/>
    <line x1="0" y1="-30" x2="19.8" y2="-49.8" stroke="#ef4a3f" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="1" rx="34" ry="6" fill="rgba(0,0,0,.22)"/>
    <rect x="-32" y="-14" width="64" height="14" rx="7" fill="#2c3440"/>
    <g fill="#59646f">
      <circle cx="-27" cy="-7" r="3.4"/><circle cx="-18" cy="-7" r="3.4"/>
      <circle cx="-9" cy="-7" r="3.4"/><circle cx="0" cy="-7" r="3.4"/>
      <circle cx="9" cy="-7" r="3.4"/><circle cx="18" cy="-7" r="3.4"/>
      <circle cx="27" cy="-7" r="3.4"/>
    </g>
    <rect x="-26" y="-30" width="52" height="18" rx="6" fill="#ef4a3f"/>
    <rect x="-26" y="-17" width="52" height="5" rx="2.5" fill="#a32a22"/>
    <path d="M-13 -30 A13 13 0 0 1 13 -30 Z" fill="#ef4a3f"/>
    <circle cx="-4" cy="-33" r="4.5" fill="rgba(255,255,255,.28)"/>
  </g>
</svg>
